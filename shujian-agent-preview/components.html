<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <title>组件样式 · 数鉴智能体预览</title>
  <link rel="stylesheet" href="agent-polish-preview.css?v=orbs-1">
</head>
<body>
  <main class="component-page">
    <div class="component-shell">
      <header class="component-header">
        <div>
          <h1>组件样式</h1>
          <p>仅展示智能体页面可复用的基础控件，不连接服务。</p>
        </div>
        <a href="index.html">返回界面预览</a>
      </header>
      <div class="component-grid">
        <section class="component-card component-card--wide">
          <h2>按钮</h2>
          <div class="component-row">
            <button class="sample-button sample-button--primary" type="button" data-component-toast="主操作按钮">主操作</button>
            <button class="sample-button sample-button--secondary" type="button" data-component-toast="次要操作按钮">次要操作</button>
            <button class="sample-button sample-button--text" type="button" data-component-toast="文字按钮">文字操作</button>
            <button class="sample-button sample-button--danger" type="button" data-component-toast="危险操作按钮">危险操作</button>
            <button class="sample-button sample-button--loading" type="button" disabled><span class="sample-spinner" aria-hidden="true"></span>处理中</button>
            <button class="sample-button sample-button--secondary" type="button" disabled>禁用</button>
          </div>
        </section>
        <section class="component-card">
          <h2>页签</h2>
          <div class="sample-tabs" role="tablist" aria-label="组件样式页签">
            <button type="button" role="tab" aria-selected="true">结果</button>
            <button type="button" role="tab" aria-selected="false">执行轨迹</button>
            <button type="button" role="tab" aria-selected="false">证据</button>
          </div>
        </section>
        <section class="component-card">
          <h2>输入容器</h2>
          <label class="sr-only" for="sampleInput">示例输入框</label>
          <textarea class="sample-input" id="sampleInput" placeholder="输入问题或补充说明…"></textarea>
          <p class="sample-help">辅助说明用于解释输入格式或下一步操作。</p>
        </section>
        <section class="component-card component-card--wide">
          <h2>轨迹工具图标</h2>
          <p class="component-note">执行轨迹里每一步的图标。带紫底的是当前启用的四个，其余为预留：在轨迹的 <code>&lt;li&gt;</code> 上写 <code>data-tool="sql"</code> 即可使用，未登记的取值落到 <code>default</code>。图标取自 morphicons 站点仓库的 icon-sets（Remix / Tabler），只取图标、不用它的形变动画。</p>
          <div class="icon-set-bar" id="iconSetBar" role="group" aria-label="切换图标集"></div>
          <div class="icon-catalog" id="iconCatalog"></div>
        </section>
      </div>
    </div>
  </main>
  <div class="toast" id="componentToast" role="status" aria-live="polite"></div>
  <script src="trace-tool-icons.js"></script>
  <script>
    (function () {
      const toast = document.getElementById('componentToast');
      let timer = 0;
      document.querySelectorAll('[data-component-toast]').forEach((button) => {
        button.addEventListener('click', () => {
          toast.textContent = button.dataset.componentToast + '（本地样式预览）';
          toast.classList.add('is-visible');
          window.clearTimeout(timer);
          timer = window.setTimeout(() => toast.classList.remove('is-visible'), 1800);
        });
      });
      document.querySelectorAll('.sample-tabs [role="tab"]').forEach((tab) => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.sample-tabs [role="tab"]').forEach((item) => item.setAttribute('aria-selected', String(item === tab)));
        });
      });

      // 图标目录：把 trace-tool-icons.js 里登记的多套图标列出来，标出哪些在用、哪些是预留。
      // 切换的那一套记进 localStorage，界面预览页读同一个键，两边保持一致。
      const catalog = document.getElementById('iconCatalog');
      const setBar = document.getElementById('iconSetBar');
      const sets = window.TRACE_TOOL_SETS || {};
      const labels = window.TRACE_TOOL_LABELS || {};
      const used = window.TRACE_TOOL_USED || [];
      const setIds = Object.keys(sets);

      if (catalog && setIds.length) {
        let active = window.TRACE_TOOL_ACTIVE || setIds[0];
        try {
          const saved = window.localStorage.getItem('traceIconSet');
          if (saved && sets[saved]) active = saved;
        } catch (error) { /* localStorage 不可用时用默认值 */ }

        const renderGlyph = (value, set) => {
          if (value && typeof value === 'object' && value.file) {
            return '<span class="icon-mask" style="--icon-src:url(&quot;' + value.file + '&quot;)"></span>';
          }
          return '<svg viewBox="' + (set.viewBox || '0 0 24 24') + '" data-style="' + (set.style || 'stroke') + '" aria-hidden="true">' + String(value) + '</svg>';
        };

        const renderCatalog = () => {
          const set = sets[active];
          catalog.innerHTML = '';
          Object.keys(set.icons).forEach((key) => {
            const item = document.createElement('div');
            item.className = 'icon-catalog__item' + (used.indexOf(key) === -1 ? '' : ' is-used');
            const orb = typeof window.traceToolOrb === 'function' ? window.traceToolOrb(key) : '';
            const orbLabel = orb && typeof window.traceToolOrbLabel === 'function' ? window.traceToolOrbLabel(orb) : orb;
            item.innerHTML =
              '<span class="icon-catalog__glyph">' + renderGlyph(set.icons[key], set) + '</span>' +
              '<span class="icon-catalog__meta"><strong>' + (labels[key] || key) + '</strong><code>' + key + '</code>' +
              (orb && used.indexOf(key) !== -1 ? '<em class="icon-catalog__orb">→ ' + orbLabel + '</em>' : '') +
              '</span>';
            catalog.appendChild(item);
          });
          if (setBar) {
            setBar.querySelectorAll('[data-icon-set]').forEach((button) => {
              button.setAttribute('aria-pressed', String(button.dataset.iconSet === active));
            });
          }
        };

        if (setBar) {
          setBar.innerHTML = setIds.map((id) =>
            '<button type="button" data-icon-set="' + id + '" aria-pressed="false">' + sets[id].label + '</button>'
          ).join('');
          setBar.querySelectorAll('[data-icon-set]').forEach((button) => {
            button.addEventListener('click', () => {
              active = button.dataset.iconSet;
              try { window.localStorage.setItem('traceIconSet', active); } catch (error) { /* 忽略 */ }
              renderCatalog();
            });
          });
        }

        renderCatalog();
      }
    })();
  </script>
</body>
</html>
